<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/src/assets/fonts/subset/Pretendard-Regular-ui.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Start only the image used by the current first screen before React mounts.
      (function () {
        var image = null;
        if (location.pathname === '/' || location.pathname === '/home') {
          image = '/images/home-day-background.webp';
        } else if (location.pathname === '/auth') {
          image = '/images/auth-landing-background.webp';
        } else if (location.pathname === '/scenarios') {
          image = '/images/scenarios-background.webp';
        }
        if (!image) return;
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = image;
        preload.fetchPriority = 'high';
        document.head.appendChild(preload);
      })();
    </script>
    <script>
      // 패드에서는 데스크톱 화면을 통째로 비율대로 줄여 스크롤 없이 한 화면에 담아요.
      // 가로로 들면 1440px, 세로로 들면 1200px 기준으로 그린 화면을 패드 폭에 맞춰요.
      // 휴대폰(짧은 변 600px 미만)과 데스크톱 브라우저는 그대로예요. (데스크톱 브라우저는 이 설정을 쓰지 않아요)
      (function () {
        var meta = document.querySelector('meta[name="viewport"]');
        function isPortrait() {
          return window.screen.orientation
            ? /portrait/.test(window.screen.orientation.type)
            : window.matchMedia('(orientation: portrait)').matches;
        }
        function fitTablet() {
          var shortSide = Math.min(window.screen.width, window.screen.height);
          if (navigator.maxTouchPoints > 0 && shortSide >= 600) {
            meta.setAttribute('content', 'width=' + (isPortrait() ? 1200 : 1440));
          }
        }
        fitTablet();
        window.addEventListener('orientationchange', fitTablet);
      })();
    </script>
    <script>
      // 화면 파일(assets/…js)을 받다가 HTML 같은 엉뚱한 응답이 브라우저에 저장되면, assets는 1년 동안 다시 받지 않아서
      // 새로고침해도 빈 화면만 나와요. 화면 파일을 못 읽으면 파일을 서버에서 새로 받아 저장된 것을 바꾼 뒤 한 번만 다시 불러와요.
      (function () {
        var KEY = 'firstory:asset-heal-at';
        var started = false;
        function heal(extra) {
          if (started) return;
          started = true;
          try {
            if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 15000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (error) {
            return;
          }
          var files = document.querySelectorAll('script[type="module"][src], link[rel="modulepreload"][href], link[rel="stylesheet"][href]');
          var urls = extra ? [extra] : [];
          for (var i = 0; i < files.length; i += 1) {
            var url = files[i].src || files[i].href;
            if (url.indexOf('/assets/') !== -1) urls.push(url);
          }
          Promise.all(urls.map(function (url) {
            return fetch(url, { cache: 'reload' }).catch(function () {});
          })).then(function () {
            location.reload();
          });
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT' && target.type === 'module') heal();
        }, true);
        // 스타일 파일은 HTML이 저장돼도 오류 없이 빈 스타일로 읽혀요. 규칙이 하나도 없으면 같은 방법으로 고쳐요.
        // (파일의 load 이벤트는 window까지 오지 않아서 document에서 받아요)
        document.addEventListener('load', function (event) {
          var target = event.target;
          if (!target || target.tagName !== 'LINK' || target.rel !== 'stylesheet' || target.href.indexOf('/assets/') === -1) return;
          var rules = 0;
          try {
            rules = target.sheet ? target.sheet.cssRules.length : 0;
          } catch (error) {
            return;
          }
          if (rules === 0) heal(target.href);
        }, true);
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <meta
      name="description"
      content="아이에게 말하기 어려운 순간, 맞춤 동화로 시작하는 FIRSTORY"
    />
    <title>FIRSTORY</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
