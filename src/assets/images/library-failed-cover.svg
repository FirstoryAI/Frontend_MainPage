<svg xmlns="http://www.w3.org/2000/svg" width="201" height="199" viewBox="0 0 201 199" fill="none">
  <!-- 만들지 못한 동화 표지: 회색 종이 위에서 연필이 가운데가 똑 부러졌고, 그리던 선은 엉켜 있어요. 제목 자리는 비어 있어요. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="201" y2="199" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEECE9"/>
      <stop offset="1" stop-color="#DAD6D1"/>
    </linearGradient>
  </defs>
  <rect width="201" height="199" fill="url(#paper)"/>

  <!-- 그리다 엉킨 선 -->
  <path d="M36 128c4-10 14-14 20-8 6 7-3 15-9 9-7-7 4-19 15-16 9 3 9 13 16 13" stroke="#ABA59F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(80 126) rotate(-38)">
    <!-- 앞쪽(심) -->
    <path d="M20 -9L0 0L20 9Z" fill="#E4D9CB"/>
    <path d="M7 -3.2L0 0L7 3.2Z" fill="#7F7973"/>
    <path d="M20 -9H50L46 -4L51 1L47 9H20Z" fill="#B9B3AC"/>
    <path d="M20 -9H50L46 -4H20Z" fill="#C8C2BB"/>

    <!-- 뒤쪽: 부러진 자리에서 꺾였어요 -->
    <g transform="translate(57 -3) rotate(-22)">
      <path d="M0 -9L4 -4L-1 1L3 9H40V-9Z" fill="#B9B3AC"/>
      <path d="M0 -9L4 -4H40V-9Z" fill="#C8C2BB"/>
      <rect x="40" y="-9" width="9" height="18" fill="#9D9790"/>
      <path d="M49 -9H57A6 6 0 0 1 63 -3V3A6 6 0 0 1 57 9H49Z" fill="#CDBFB6"/>
    </g>
  </g>

  <!-- 부러진 자리에서 튄 조각 -->
  <path d="M128 108l5 1-3 4z" fill="#B9B3AC"/>
  <path d="M121 82l4 2-3 3z" fill="#C3BDB6"/>

  <!-- 아직 비어 있는 제목 자리 -->
  <rect x="48" y="152" width="105" height="8" rx="4" fill="#CBC6C0"/>
  <rect x="66" y="167" width="69" height="8" rx="4" fill="#D2CDC7"/>
</svg>
